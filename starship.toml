"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000
scan_timeout = 30

# Text-only Tokyo Night — soft 2-line
# L1: [user@host ]dir branch [dirty] [venv] [duration]
# L2: [status] [jobs] ❯
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$cmd_duration\
$line_break\
$status\
$jobs\
$character"""

right_format = ""

palette = "tokyo_night"

[palettes.tokyo_night]
blue   = "#7aa2f7"
purple = "#bb9af7"
green  = "#9ece6a"
yellow = "#e0af68"
red    = "#f7768e"
grey   = "#565f89"

# ── Modules ───────────────────────────────────────────────────

[directory]
style = "fg:blue"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " RO"
read_only_style = "fg:red"

[git_branch]
style = "fg:purple"
format = "[$branch]($style) "

[git_status]
style = "fg:yellow"
ignore_submodules = true
# Parent () = hidden when clean (no status, not ahead/behind)
format = '([${all_status}${ahead_behind}]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${count}"
untracked = "?${count}"
stashed = '$'
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[python]
style = "fg:green"
# Parent () = hidden when no venv
format = '([$virtualenv]($style) )'

[cmd_duration]
min_time = 2000
style = "fg:grey"
format = "[$duration]($style) "

[status]
disabled = false
style = "bold fg:red"
symbol = "✘"
map_symbol = true
format = '[$symbol]($style) '

[jobs]
style = "bold fg:yellow"
number_threshold = 1
format = "[&$number]($style) "

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"

[username]
# show_always=false → only root or SSH (ssh_only removed in Starship 1.25)
show_always = false
style_user = "fg:grey"
format = "[$user]($style)@"

[hostname]
ssh_only = true
ssh_symbol = ""
style = "fg:grey"
format = "[$hostname]($style) "
